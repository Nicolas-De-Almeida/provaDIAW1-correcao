<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Candidatos 2026 - MG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="cabecalho">
        <h1>Candidatos 2026 - MG</h1>
    </header>

    <main class="conteudo">

        <form method="get" th:action="@{/}" class="filtros">
            <div class="campo">
                <label>Buscar por nome / número</label>
                <input type="text" name="texto" th:value="${textoSelecionado}" placeholder="Ex: Ana, 1240...">
            </div>

            <div class="campo">
                <label>Cargo</label>
                <select name="cargo">
                    <option value="" th:selected="${cargoSelecionado == ''}">Todos</option>
                    <option th:each="c : ${cargos}"
                            th:value="${c}"
                            th:text="${c}"
                            th:selected="${c == cargoSelecionado}"></option>
                </select>
            </div>

            <div class="campo">
                <label>Partido</label>
                <select name="partido">
                    <option value="" th:selected="${partidoSelecionado == ''}">Todos</option>
                    <option th:each="p : ${partidos}"
                            th:value="${p}"
                            th:text="${p}"
                            th:selected="${p == partidoSelecionado}"></option>
                </select>
            </div>

            <button type="submit">Filtrar</button>
            <a th:href="@{/}" class="limpar">Limpar</a>
        </form>

        <p class="resultado-info">
            <span th:text="${totalEncontrado}">0</span> candidatos encontrados.
        </p>

        <p th:if="${totalEncontrado == 0}" class="sem-resultado">
            Nenhum candidato encontrado.
        </p>

        <div class="grade-candidatos">
            <div class="card" th:each="cand : ${candidatos}">
                <img th:src="@{/images/candidatos/{nome}(nome=${cand.nomeArquivoFoto})}" th:alt="${cand.nomeUrna}" class="foto-candidato">
                
                <h3 th:text="${cand.nomeUrna}"></h3>
                <p><strong>Número:</strong> <span th:text="${cand.nrCandidato}"></span></p>
                <p th:text="${cand.cargo}"></p>
                <p th:text="${cand.siglaPartido + ' - ' + cand.nomePartido}"></p>
                
                <p class="situacao" th:if="${cand.situacaoCandidatura != null and !cand.situacaoCandidatura.isBlank()}" th:text="${cand.situacaoCandidatura}">Situação</p>

                <p class="extra" th:if="${cand.idade > 0}">
                    <span th:text="${cand.idade + ' anos'}">Idade</span>
                </p>

                <p class="extra" th:if="${cand.ocupacao != null and !cand.ocupacao.isBlank()}" th:text="${cand.ocupacao}">Ocupação</p>

                <p class="extra" th:if="${cand.grauInstrucao != null and !cand.grauInstrucao.isBlank()}" th:text="${cand.grauInstrucao}">Escolaridade</p>
                
                <p class="extra" th:if="${cand.nomeCandidato != null and !cand.nomeCandidato.isBlank()}" th:text="${cand.nomeCandidato}">Nome Civil</p>
            </div>
        </div>

    </main>

</body>
</html>
